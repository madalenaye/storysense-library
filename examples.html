<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body  { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f3f4f6; }
    h1    { font-size: 13px; font-weight: 700; color: #111827; margin: 0 0 6px; letter-spacing: .03em; }
    .lede { font-size: 12px; color: #6b7280; margin: 0 0 20px; max-width: 720px; line-height: 1.55; }
    .lede code { background: #e5e7eb; padding: 1px 6px; border-radius: 4px; font-size: 11px; color: #374151; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: flex; flex-direction: column; }
    .card h2 { font-size: 10px; font-weight: 600; color: #9ca3af; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .07em; }
    .chart { width: 100%; }
    .code  {
      margin: 12px 0 0; padding: 12px 14px;
      background: #1e1e2e; color: #cdd6f4;
      border-radius: 8px;
      font-family: ui-monospace, 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 11px; line-height: 1.65;
      white-space: pre; overflow-x: auto;
    }
    .err  { font-size: 11px; color: #ef4444; padding: 6px 0; }
  </style>
</head>
<body>
<h1>All primitive combinations</h1>
<p class="lede">
  Each card shows a primitive stack rendered against
  <code>little-red-riding-hood.json</code>, with the exact code used to build it.
  Copy any snippet into your own project (after the usual <code>import SS from …</code> and
  <code>const story = SS.normalizeNarrative(raw)</code> setup).
</p>
<div class="grid" id="grid"></div>

<script type="module">
import SS from './src/index.js';

const raw   = await fetch('./stories/little-red-riding-hood.json').then(r => r.json());
const story = SS.normalizeNarrative(raw);

const LAND = 860 / 460;   // landscape  — horizontal timeline
const PORT = 460 / 860;   // portrait   — vertical timeline

const cases = [

  {
    label: 'x · lane above · lifelines',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x' }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .render(),
  },
  {
    label: 'x · lane below · lifelines',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x' }))
      .add(SS.participants({ layout: 'lane', side: 'below', r: 12, labels: true }))
      .add(SS.lifelines())
      .render(),
  },
  {
    label: 'x · lane both · lifelines',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x' }))
      .add(SS.participants({ layout: 'lane', side: 'both', r: 10, labels: true }))
      .add(SS.lifelines())
      .render(),
  },

  {
    label: 'x · lane above · lifelines · events',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x' }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .add(SS.events())
      .render(),
  },
  {
    label: 'x · lane above · lifelines · edges',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x' }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .add(SS.edges())
      .render(),
  },
  {
    label: 'x · lane below · lifelines · edges',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x' }))
      .add(SS.participants({ layout: 'lane', side: 'below', r: 12, labels: true }))
      .add(SS.lifelines())
      .add(SS.edges())
      .render(),
  },
  {
    label: 'x · lane above · lifelines · events · edges  [full horizontal]',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x' }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .add(SS.events())
      .add(SS.edges())
      .render(),
  },

  {
    label: 'x · force · edges',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x' }))
      .add(SS.participants({ layout: 'force', side: 'above', r: 12 }))
      .add(SS.edges())
      .render(),
  },

  {
    label: 'x · events only  (no participants)',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x' }))
      .add(SS.events())
      .render(),
  },

  {
    label: 'y · lane above (left) · lifelines',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: PORT })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'y' }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .render(),
  },
  {
    label: 'y · lane below (right) · lifelines',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: PORT })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'y' }))
      .add(SS.participants({ layout: 'lane', side: 'below', r: 12, labels: true }))
      .add(SS.lifelines())
      .render(),
  },
  {
    label: 'y · lane both · lifelines',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: PORT })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'y' }))
      .add(SS.participants({ layout: 'lane', side: 'both', r: 10, labels: true }))
      .add(SS.lifelines())
      .render(),
  },
  {
    label: 'y · lane above · lifelines · events',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: PORT })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'y' }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .add(SS.events())
      .render(),
  },
  {
    label: 'y · lane above · lifelines · edges',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: PORT })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'y' }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .add(SS.edges())
      .render(),
  },
  {
    label: 'y · lane above · lifelines · events · edges  [full vertical]',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: PORT })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'y' }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .add(SS.events())
      .add(SS.edges())
      .render(),
  },

  {
    label: 'network  (standalone — participants sized by importance)',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.network({ r: 16, labels: true }))
      .render(),
  },
  {
    label: 'network · edges  (interaction edges on the force graph)',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.network({ r: 16, labels: true }))
      .add(SS.edges())
      .render(),
  },

  {
    label: 'locations · movement  (location map — drag nodes to rearrange)',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.locations({ r: 28, labels: true }))
      .add(SS.movement({ arrow: true }))
      .render(),
  },

  {
    label: 'x · lane above · lifelines · showLocations',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x', showLocations: true }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .render(),
  },
  {
    label: 'x · lane above · lifelines · events · showLocations',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: LAND })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'x', showLocations: true }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .add(SS.events())
      .render(),
  },
  {
    label: 'y · lane above · lifelines · showLocations',
    build: el => SS.storysense(el, story, { responsive: true, aspectRatio: PORT })
      .add(SS.tooltip())
      .add(SS.timeline({ direction: 'y', showLocations: true }))
      .add(SS.participants({ layout: 'lane', side: 'above', r: 12, labels: true }))
      .add(SS.lifelines())
      .render(),
  },
];

function codeFor(buildFn) {
  const src = buildFn.toString()
    .replace(/^el\s*=>\s*SS\.storysense\(el,/, "SS.storysense('#chart',");
  const lines = src.split('\n');
  const dedented = lines.map((l, i) => i === 0 ? l : l.replace(/^\s{6}/, '  '));
  return dedented.join('\n').replace(/\s*$/, '') + ';';
}

const grid = document.getElementById('grid');

cases.forEach(({ label, build }) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${label}</h2>`;

  const chart = document.createElement('div');
  chart.className = 'chart';
  card.appendChild(chart);

  const code = document.createElement('pre');
  code.className = 'code';
  code.textContent = codeFor(build);
  card.appendChild(code);

  grid.appendChild(card);

  try {
    build(chart);
  } catch (e) {
    chart.innerHTML = `<div class="err">Error: ${e.message}</div>`;
    console.error(label, e);
  }
});
</script>
</body>
</html>
